<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Export to MinaFlix</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>MinaFlix</strong>
      <span>Sync</span>
    </header>
    <p>Export the titles on your own My List and viewing activity. The file stays on this computer.</p>
    <button id="export" type="button">Export My List and history</button>
    <button id="catalog" class="ghost" type="button">Sync full catalog</button>
    <label class="cap">Detail limit
      <input id="cap" type="number" min="0" step="1" placeholder="all" />
    </label>
    <p id="summary" role="status"></p>
    <p id="status"></p>
    <p class="fine">Read-only. This does not ask for your password, read cookies, or touch video. Netflix’s pages can change, and this export may violate Netflix’s terms.</p>
    <script src="popup.js"></script>
  </body>
</html>
